[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docready"
version = "1.0.0"
description = "DocReady — An Offline Intranet Platform for Template-Aware Document Formatting Analysis and Readiness Verification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "pymupdf>=1.22.0",
    "opencv-python-headless>=4.7.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.15.0"
]
research = [
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0"
]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
docready = "app:main"
specguard = "app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

