[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard"
version = "1.0.0"
description = "SpecGuard — Engineering Document Quality & Compliance Inspection Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.22.0",
    "opencv-python-headless>=4.7.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0"
]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
specguard = "app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

